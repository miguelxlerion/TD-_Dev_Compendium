<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="letters" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f1ff"/>
      <stop offset=".55" stop-color="#c9bfff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".32" r=".75">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/>
      <stop offset=".6" stop-color="#8b5cf6" stop-opacity=".12"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eclipse" cx=".38" cy=".34" r=".8">
      <stop offset="0" stop-color="#2b2b4a"/>
      <stop offset=".7" stop-color="#141422"/>
      <stop offset="1" stop-color="#0a0a12"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="#0a0a12"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#glow)"/>
  <!-- eclipse: luna oscura con anillo de luz -->
  <circle cx="256" cy="196" r="96" fill="none" stroke="url(#edge)" stroke-width="14"/>
  <circle cx="256" cy="196" r="96" fill="url(#eclipse)"/>
  <circle cx="288" cy="168" r="78" fill="#0a0a12" opacity=".55"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="url(#edge)" stroke-width="20"/>
  <text x="256" y="428" text-anchor="middle" font-family="Cinzel, Georgia, 'Times New Roman', serif"
        font-weight="800" font-size="150" letter-spacing="8" fill="url(#letters)">TD</text>
</svg>
